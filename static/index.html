<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muni Live Map (unofficial)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <div id="status" class="status">Loading live vehicles…</div>
  <div id="banner" class="banner" role="alert" hidden></div>
  <div id="loading" class="loading">
    <div class="spinner" aria-hidden="true"></div>
    <div>Loading live Muni vehicles…</div>
  </div>

  <aside id="panel" class="panel">
    <div class="panel-header">
      <button id="panel-toggle" type="button" class="panel-toggle" aria-expanded="true" aria-controls="panel-body">Routes</button>
      <button id="clear-routes" type="button" class="clear" disabled>Show all</button>
    </div>
    <div class="panel-body" id="panel-body">
      <input id="route-search" type="search" placeholder="Search, e.g. 38 or Geary"
             autocomplete="off" aria-label="Search routes">
      <div id="route-list"></div>
    </div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
